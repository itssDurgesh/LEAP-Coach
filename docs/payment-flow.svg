<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1180" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#DC2626"/>
    </marker>
    <style>
      .t  { fill:#0C1B36; font-size:15px; }
      .tb { fill:#0C1B36; font-size:15px; font-weight:700; }
      .ts { fill:#5B6472; font-size:12.5px; }
      .tw { fill:#ffffff; font-size:15px; font-weight:700; }
      .tws{ fill:#E7ECF5; font-size:12.5px; }
      .title { fill:#0C1B36; font-size:26px; font-weight:800; }
      .sub   { fill:#5B6472; font-size:14px; }
      .lane  { fill:#5B6472; font-size:13px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="1320" height="1180" fill="#FBF7EF"/>
  <text x="48" y="56" class="title">LEAP Coach — Payment &amp; Fulfilment Flow</text>
  <text x="48" y="80" class="sub">Razorpay (test/live) · server-authoritative pricing · idempotent grants · webhook reconcile · admin recovery</text>

  <!-- lane labels -->
  <text x="120" y="120" class="lane" text-anchor="middle">LEARNER (browser)</text>
  <text x="660" y="120" class="lane" text-anchor="middle">LEAP SERVER (Next.js API + Supabase service role)</text>
  <text x="1180" y="120" class="lane" text-anchor="middle">RAZORPAY / DB / ADMIN</text>
  <line x1="250" y1="130" x2="250" y2="1140" stroke="#E3DAC8" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="1060" y1="130" x2="1060" y2="1140" stroke="#E3DAC8" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- 1. Enroll/Upgrade -->
  <rect x="20" y="150" width="220" height="64" rx="12" fill="#F4D58A" stroke="#C89218"/>
  <text x="130" y="178" class="tb" text-anchor="middle">1 · Enroll / Upgrade</text>
  <text x="130" y="198" class="ts" text-anchor="middle">CheckoutModal opens</text>

  <!-- profile gate -->
  <rect x="20" y="244" width="220" height="74" rx="12" fill="#FFFFFF" stroke="#C89218" stroke-dasharray="5 4"/>
  <text x="130" y="270" class="tb" text-anchor="middle">Profile complete?</text>
  <text x="130" y="289" class="ts" text-anchor="middle">age · gender · phone ·</text>
  <text x="130" y="305" class="ts" text-anchor="middle">company · country</text>
  <text x="20" y="346" class="ts">No → redirect to /account (blocks purchase)</text>

  <!-- 2. order route -->
  <rect x="400" y="244" width="520" height="92" rx="12" fill="#16305C" stroke="#0C1B36"/>
  <text x="416" y="272" class="tw">2 · POST /api/payments/razorpay/order</text>
  <text x="416" y="294" class="tws">• Clerk auth (binds buyer) · quotePrice(): base price from DB,</text>
  <text x="416" y="312" class="tws">  pay-the-difference upgrade, coupon — amount is authoritative here</text>
  <text x="416" y="330" class="tws">• Creates Razorpay order; userId+plan stored in order notes</text>

  <!-- mock fallback -->
  <rect x="400" y="356" width="520" height="34" rx="9" fill="#FBEFD6" stroke="#E3C780"/>
  <text x="416" y="378" class="ts">No Razorpay keys → client uses mock checkout (dev only, no real charge)</text>

  <!-- 3. checkout -->
  <rect x="1075" y="250" width="230" height="80" rx="12" fill="#F4D58A" stroke="#C89218"/>
  <text x="1190" y="278" class="tb" text-anchor="middle">3 · Razorpay Checkout</text>
  <text x="1190" y="298" class="ts" text-anchor="middle">UPI / Card / Netbanking</text>
  <text x="1190" y="316" class="ts" text-anchor="middle">user authorises payment</text>

  <!-- failed payment -->
  <rect x="1075" y="346" width="230" height="58" rx="10" fill="#FEECEC" stroke="#F0A8A8"/>
  <text x="1190" y="370" class="tb" text-anchor="middle" fill="#B91C1C">Payment failed / dismissed</text>
  <text x="1190" y="389" class="ts" text-anchor="middle">No charge · learner can retry</text>

  <!-- 4. verify -->
  <rect x="400" y="450" width="520" height="110" rx="12" fill="#16305C" stroke="#0C1B36"/>
  <text x="416" y="478" class="tw">4 · POST /api/payments/razorpay/verify</text>
  <text x="416" y="500" class="tws">• Verify HMAC signature (order_id|payment_id)</text>
  <text x="416" y="518" class="tws">• Re-confirm with Razorpay API: status captured + amount matches</text>
  <text x="416" y="536" class="tws">• Identify buyer via Clerk session (never trusts the client)</text>
  <text x="416" y="554" class="tws">• plan / course / categories read from server order notes</text>

  <!-- 5. processPayment -->
  <rect x="400" y="588" width="520" height="92" rx="12" fill="#16305C" stroke="#0C1B36"/>
  <text x="416" y="616" class="tw">5 · processPayment()  (shared by verify + webhook)</text>
  <text x="416" y="638" class="tws">• Record receipt — idempotent on UNIQUE razorpay_payment_id</text>
  <text x="416" y="656" class="tws">• grantAccess(): course / category passes / all-access; resets</text>
  <text x="416" y="674" class="tws">  course access timer; coupon counted once</text>

  <!-- 6a granted -->
  <rect x="380" y="724" width="270" height="78" rx="12" fill="#E5F6EA" stroke="#7DCB98"/>
  <text x="396" y="750" class="tb" fill="#15803D">6a · Access granted ✓</text>
  <text x="396" y="770" class="ts">grant_status = granted</text>
  <text x="396" y="788" class="ts">receipt saved under /account</text>

  <!-- 6b grant_failed -->
  <rect x="672" y="724" width="270" height="78" rx="12" fill="#FEECEC" stroke="#F0A8A8"/>
  <text x="688" y="750" class="tb" fill="#B91C1C">6b · Captured, not granted</text>
  <text x="688" y="770" class="ts">grant_status = grant_failed</text>
  <text x="688" y="788" class="ts">flagged — payment never lost</text>

  <!-- webhook -->
  <rect x="1075" y="600" width="230" height="120" rx="12" fill="#23406E" stroke="#0C1B36"/>
  <text x="1190" y="626" class="tw" text-anchor="middle">Webhook (safety net)</text>
  <text x="1190" y="648" class="tws" text-anchor="middle">Razorpay → POST /webhook</text>
  <text x="1190" y="666" class="tws" text-anchor="middle">on payment.captured</text>
  <text x="1190" y="688" class="tws" text-anchor="middle">runs processPayment too —</text>
  <text x="1190" y="706" class="tws" text-anchor="middle">grants even if tab closed</text>

  <!-- admin recovery -->
  <rect x="380" y="864" width="780" height="92" rx="12" fill="#FFFFFF" stroke="#C89218"/>
  <text x="400" y="892" class="tb">Admin · /admin/payments  (owner, or sub-admin with “Payments” permission)</text>
  <text x="400" y="914" class="ts">Live dashboard: revenue · subscriptions · receipts · “Needs attention” list</text>
  <text x="400" y="934" class="ts">Retry grant (re-runs grantAccess for a flagged row) · Refund — owner only (full Razorpay refund, idempotent)</text>

  <!-- arrows -->
  <line x1="130" y1="214" x2="130" y2="244" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M240,280 H400" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="272" class="ts">Yes</text>
  <path d="M920,290 H1075" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="965" y="282" class="ts">order id</text>
  <line x1="1190" y1="330" x2="1190" y2="346" stroke="#DC2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M1075,300 C980,300 900,440 920,470" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="940" y="430" class="ts">on success</text>
  <line x1="660" y1="560" x2="660" y2="588" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,680 V724" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M800,680 V724" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M1190,720 C1190,800 980,763 942,763" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1000" y="800" class="ts">reconcile</text>
  <path d="M807,802 V864" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="815" y="838" class="ts">needs action</text>

  <!-- legend -->
  <rect x="48" y="1010" width="1224" height="120" rx="12" fill="#FFFFFF" stroke="#E3DAC8"/>
  <text x="68" y="1038" class="tb">Why it's safe</text>
  <text x="68" y="1062" class="t">• Amount is computed server-side from the DB — the client can never set or fake the price or discount.</text>
  <text x="68" y="1084" class="t">• Every grant is idempotent (unique razorpay_payment_id + upserts): verify + webhook + retries can't double-charge or double-grant.</text>
  <text x="68" y="1106" class="t">• A captured payment whose grant fails is recorded as grant_failed and flagged — money is never lost; admin retries or refunds.</text>
</svg>

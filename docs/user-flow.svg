<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1000" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9AA3B2"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C89218"/>
    </marker>
    <style>
      .title{ fill:#0C1B36; font-size:26px; font-weight:800; }
      .sub  { fill:#5B6472; font-size:14px; }
      .ph   { fill:#0C1B36; font-size:14px; font-weight:800; letter-spacing:.5px; }
      .h    { fill:#0C1B36; font-size:13.5px; font-weight:700; }
      .s    { fill:#5B6472; font-size:11.5px; }
      .tw   { fill:#ffffff; font-size:13.5px; font-weight:700; }
    </style>
  </defs>

  <rect width="1380" height="1000" fill="#FBF7EF"/>
  <text x="48" y="54" class="title">LEAP Coach — User Interaction Flow</text>
  <text x="48" y="78" class="sub">Learner journey from sign-up to mastery · admin runs the platform underneath</text>

  <!-- phase bands -->
  <g>
    <rect x="40"   y="104" width="200" height="700" rx="14" fill="#F3EEE2"/>
    <rect x="260"  y="104" width="200" height="700" rx="14" fill="#F7F1E0"/>
    <rect x="480"  y="104" width="200" height="700" rx="14" fill="#F3EEE2"/>
    <rect x="700"  y="104" width="200" height="700" rx="14" fill="#F7F1E0"/>
    <rect x="920"  y="104" width="200" height="700" rx="14" fill="#F3EEE2"/>
    <rect x="1140" y="104" width="200" height="700" rx="14" fill="#F7F1E0"/>
    <text x="140"  y="128" class="ph" text-anchor="middle">1 · ONBOARD</text>
    <text x="360"  y="128" class="ph" text-anchor="middle">2 · HOME</text>
    <text x="580"  y="128" class="ph" text-anchor="middle">3 · DISCOVER</text>
    <text x="800"  y="128" class="ph" text-anchor="middle">4 · GET ACCESS</text>
    <text x="1020" y="128" class="ph" text-anchor="middle">5 · LEARN</text>
    <text x="1240" y="128" class="ph" text-anchor="middle">6 · COMPLETE &amp; GROW</text>
  </g>

  <!-- col 1 ONBOARD -->
  <g>
    <rect x="56" y="150" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="140" y="174" class="h" text-anchor="middle">Landing page</text>
    <text x="140" y="192" class="s" text-anchor="middle">hero · pricing · topics</text>

    <rect x="56" y="230" width="168" height="70" rx="10" fill="#F4D58A" stroke="#C89218"/>
    <text x="140" y="254" class="h" text-anchor="middle">Sign up / Sign in</text>
    <text x="140" y="272" class="s" text-anchor="middle">Clerk · Google or</text>
    <text x="140" y="288" class="s" text-anchor="middle">email + 6-digit code</text>

    <rect x="56" y="322" width="168" height="64" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="140" y="346" class="h" text-anchor="middle">Pick your role</text>
    <text x="140" y="364" class="s" text-anchor="middle">Student · Professional</text>
    <text x="140" y="380" class="s" text-anchor="middle">· Entrepreneur</text>
  </g>

  <!-- col 2 HOME -->
  <g>
    <rect x="276" y="150" width="168" height="76" rx="10" fill="#16305C" stroke="#0C1B36"/>
    <text x="360" y="176" class="tw" text-anchor="middle">Dashboard</text>
    <text x="360" y="194" class="s" fill="#D6DEEC" text-anchor="middle">progress · recommended</text>
    <text x="360" y="210" class="s" fill="#D6DEEC" text-anchor="middle">· wisdom · resources</text>

    <rect x="276" y="244" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="360" y="268" class="h" text-anchor="middle">Plan badge</text>
    <text x="360" y="286" class="s" text-anchor="middle">Free · Pro · Pro+ · Max</text>

    <rect x="276" y="320" width="168" height="76" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="360" y="344" class="h" text-anchor="middle">Nudges</text>
    <text x="360" y="362" class="s" text-anchor="middle">complete profile ·</text>
    <text x="360" y="378" class="s" text-anchor="middle">announcements · upgrade</text>
  </g>

  <!-- col 3 DISCOVER -->
  <g>
    <rect x="496" y="150" width="168" height="62" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="580" y="174" class="h" text-anchor="middle">Browse Topics</text>
    <text x="580" y="192" class="s" text-anchor="middle">catalog · filter by path</text>

    <rect x="496" y="232" width="168" height="78" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="580" y="256" class="h" text-anchor="middle">Topic detail</text>
    <text x="580" y="274" class="s" text-anchor="middle">syllabus · roadmap ·</text>
    <text x="580" y="290" class="s" text-anchor="middle">price · access duration</text>
  </g>

  <!-- col 4 GET ACCESS -->
  <g>
    <rect x="716" y="150" width="168" height="58" rx="10" fill="#E5F6EA" stroke="#7DCB98"/>
    <text x="800" y="174" class="h" text-anchor="middle" fill="#15803D">Free topic</text>
    <text x="800" y="192" class="s" text-anchor="middle">enroll instantly</text>

    <rect x="716" y="228" width="168" height="92" rx="10" fill="#F4D58A" stroke="#C89218"/>
    <text x="800" y="252" class="h" text-anchor="middle">Buy / Upgrade</text>
    <text x="800" y="270" class="s" text-anchor="middle">profile gate first →</text>
    <text x="800" y="286" class="s" text-anchor="middle">Razorpay checkout</text>
    <text x="800" y="304" class="s" text-anchor="middle">(see payment-flow.svg)</text>

    <rect x="716" y="340" width="168" height="66" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="800" y="364" class="h" text-anchor="middle">Access granted</text>
    <text x="800" y="382" class="s" text-anchor="middle">time-boxed if the admin</text>
    <text x="800" y="398" class="s" text-anchor="middle">set a duration</text>
  </g>

  <!-- col 5 LEARN -->
  <g>
    <rect x="936" y="150" width="168" height="72" rx="10" fill="#16305C" stroke="#0C1B36"/>
    <text x="1020" y="176" class="tw" text-anchor="middle">Watch video</text>
    <text x="1020" y="194" class="s" fill="#D6DEEC" text-anchor="middle">Mux player +</text>
    <text x="1020" y="210" class="s" fill="#D6DEEC" text-anchor="middle">LEAP AI tutor</text>

    <rect x="936" y="238" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="1020" y="262" class="h" text-anchor="middle">Save notes ·</text>
    <text x="1020" y="280" class="s" text-anchor="middle">discuss (@mention → 🔔)</text>

    <rect x="936" y="314" width="168" height="92" rx="10" fill="#FBEFD6" stroke="#E3C780"/>
    <text x="1020" y="338" class="h" text-anchor="middle">Checkpoint test</text>
    <text x="1020" y="356" class="s" text-anchor="middle">wrong answer → AI hint</text>
    <text x="1020" y="372" class="s" text-anchor="middle">(no reveal) · up to 4 tries</text>
    <text x="1020" y="388" class="s" text-anchor="middle">then reveal · unlock next</text>
  </g>

  <!-- col 6 COMPLETE & GROW -->
  <g>
    <rect x="1156" y="150" width="168" height="80" rx="10" fill="#E5F6EA" stroke="#7DCB98"/>
    <text x="1240" y="174" class="h" text-anchor="middle" fill="#15803D">Topic report</text>
    <text x="1240" y="192" class="s" text-anchor="middle">days to complete +</text>
    <text x="1240" y="208" class="s" text-anchor="middle">★ rating (1st/2nd-try)</text>
    <text x="1240" y="224" class="s" text-anchor="middle">+ download notes PDF</text>

    <rect x="1156" y="248" width="168" height="66" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
    <text x="1240" y="272" class="h" text-anchor="middle">Access expires</text>
    <text x="1240" y="290" class="s" text-anchor="middle">renew (subscriber) /</text>
    <text x="1240" y="306" class="s" text-anchor="middle">re-buy (à-la-carte)</text>

    <rect x="1156" y="332" width="168" height="74" rx="10" fill="#F4D58A" stroke="#C89218"/>
    <text x="1240" y="356" class="h" text-anchor="middle">Upgrade plan</text>
    <text x="1240" y="374" class="s" text-anchor="middle">add catalogs ·</text>
    <text x="1240" y="390" class="s" text-anchor="middle">pay the difference</text>
  </g>

  <!-- inter-column arrows -->
  <line x1="140" y1="208" x2="140" y2="230" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <line x1="140" y1="300" x2="140" y2="322" stroke="#9AA3B2" stroke-width="2" marker-end="url(#a)"/>
  <path d="M224,354 H276" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M444,188 H496" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M664,200 C685,200 695,178 716,178" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M664,260 C685,260 695,272 716,272" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M884,374 C905,374 905,186 936,186" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M884,180 C905,180 915,186 936,186" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M1104,360 C1125,360 1135,190 1156,190" stroke="#9AA3B2" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- learn loop -->
  <path d="M1020,406 C1020,448 1020,448 1020,448 L1020,470 H1020" stroke="#C89218" stroke-width="2" fill="none"/>
  <path d="M1020,406 C1000,470 1040,470 1020,406" stroke="none" fill="none"/>
  <text x="1020" y="430" class="s" text-anchor="middle" fill="#C89218">repeat per video → unlock next</text>

  <!-- upgrade loops back to dashboard -->
  <path d="M1240,406 C1240,560 360,560 360,420" stroke="#C89218" stroke-width="2" fill="none" marker-end="url(#ag)" stroke-dasharray="6 5"/>
  <text x="800" y="552" class="s" text-anchor="middle" fill="#C89218">upgrade / renew → plan badge updates on the dashboard</text>

  <!-- side rails -->
  <rect x="276" y="600" width="824" height="56" rx="10" fill="#FFFFFF" stroke="#E3DAC8"/>
  <text x="292" y="624" class="h">Always available from the top nav:</text>
  <text x="292" y="644" class="s">Announcements (admin broadcasts) · Articles · Live sessions · My profile / account · Notifications bell</text>

  <!-- ADMIN band -->
  <rect x="40" y="844" width="1300" height="120" rx="14" fill="#0C1B36"/>
  <text x="64" y="876" class="tw" font-size="16">ADMIN — runs underneath (owner + permissioned sub-admins)</text>
  <g fill="#16305C" stroke="#2B4675">
    <rect x="64"   y="892" width="196" height="52" rx="9"/>
    <rect x="276"  y="892" width="196" height="52" rx="9"/>
    <rect x="488"  y="892" width="220" height="52" rx="9"/>
    <rect x="724"  y="892" width="196" height="52" rx="9"/>
    <rect x="936"  y="892" width="184" height="52" rx="9"/>
    <rect x="1136" y="892" width="180" height="52" rx="9"/>
  </g>
  <g fill="#EAF0FA" font-size="12.5" text-anchor="middle">
    <text x="162"  y="916">Content Studio</text><text x="162"  y="934" fill="#A9B6CE">topics · expiry · tests</text>
    <text x="374"  y="916">Announcements</text><text x="374"  y="934" fill="#A9B6CE">broadcast to learners</text>
    <text x="598"  y="916">Payments &amp; Subscriptions</text><text x="598" y="934" fill="#A9B6CE">owner / “Payments” sub-admin</text>
    <text x="822"  y="916">Team · Homepage CMS</text><text x="822" y="934" fill="#A9B6CE">site content</text>
    <text x="1028" y="916">Users &amp; access</text><text x="1028" y="934" fill="#A9B6CE">grant sub-admin perms</text>
    <text x="1226" y="916">Approvals · Coupons</text><text x="1226" y="934" fill="#A9B6CE">owner only</text>
  </g>
</svg>
